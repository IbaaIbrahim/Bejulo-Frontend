server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # HTML must be revalidated on every visit: it is what carries the ?v=
    # stamps that let the CSS/JS below be cached for a year (see the asset
    # block, and stamp-assets.py). Cached HTML would keep pointing returning
    # visitors at the previous build's JS.
    #
    # This sits at server level on purpose. A location block that declares any
    # add_header of its own inherits none from here — which is exactly what the
    # asset block below wants, and how it keeps `immutable` — while `location /`
    # declares none and so picks this up.
    add_header Cache-Control "no-cache" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff
        font/woff2;

    # Health check endpoint
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Static asset caching (mp4/webm: the home hero video; pdf: the ISO
    # certificates linked from the footer)
    #
    # `immutable` is only safe for a URL that changes when its bytes do. CSS and
    # JS are referenced with a ?v=<content hash> for exactly that reason. The
    # rest — images, fonts, video, the certificates — are not stamped, so a
    # replacement kept under the same filename will not reach anyone who has
    # already loaded the old one. Give it a new filename, or add it to the
    # pattern in stamp-assets.py.
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|eot|mp4|webm|pdf)$ {
        # One header, not two: `expires 1y` emits its own Cache-Control, so
        # pairing it with an explicit one sent both `max-age=31536000` and
        # `public, immutable` on every asset.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Route matching with .html fallback
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
