<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects in Hungary | bejulo</title>
<meta name="description" content="A 23 MWp PV plant at Bükkabrany, built on a former opencast coal mine.">
<link rel="preload" href="assets/fonts/source-sans-3-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/style.css?v=17d5e3b7">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/favicon.svg">
</head>
<!-- Country project page, reached from the "Read more…" link in a map popup on
     projects.html. Client review 2026-09-15 replaced the Services-style card
     (one photo, alternating sides) with a grid of its own: two cards per row at
     desktop, one from tablet down, copy above the photos, and every photo
     supplied for a project shown — see .card-stack in style.css.
     All copy lives in assets/js/content.js under the proj.* keys. -->
<body data-page="projects" data-meta="project-hungary" data-header="overlay">

<div id="site-header"></div>

<main id="main">

  <section class="hero">
    <img class="hero__media" src="assets/img/hero-projects.jpg" width="4032" height="1607"
         alt="Rows of solar modules stretching towards the horizon"
         data-i18n-attr="alt:proj.hero.alt" fetchpriority="high">
    <span class="hero__scrim"></span>
  </section>

  <section class="section">
    <div class="container stack">
      <h1 class="h2" data-i18n="proj.hungary.h1">Hungary</h1>

      <p class="lede" data-i18n="proj.hungary.stats">1 PV Plant installed and commissioned, with a total capacity of 23 MWp.</p>

      <div class="card-stack">

        <article class="card">
          <div class="card__body">
            <h3 class="card__title">
              <span data-i18n="proj.bukkabrany.title">Bukkabrany</span>
            </h3>
            <p data-i18n="proj.bukkabrany.body">A 23 MWp PV plant, which we planned and constructed on a former opencast coal mine.</p>
            <dl class="specs" data-i18n-html="proj.bukkabrany.specs" data-i18n-attr="aria-label:proj.specs.label" aria-label="Project data"><dt>Installed capacity:</dt><dd>22.7 MWp</dd><dt>Construction time:</dt><dd>Sep 2018 – Feb 2019</dd></dl>
          </div>
          <div class="card__media">
            <img src="assets/img/projects/bukkabrany.jpg" width="1600" height="1200" loading="lazy"
                 alt="Aerial view of the Bükkabrany solar park on a reclaimed opencast coal mine" data-i18n-attr="alt:proj.bukkabrany.alt">
          </div>
        </article>

      </div>
    </div>
  </section>

  <section class="section section--tight">
    <div class="container">
      <div class="btn-row">
        <a class="btn" href="projects.html" data-i18n="project.back">Back to all projects</a>
        <a class="btn" href="contact.html" data-i18n="btn.contact">Get in touch!</a>
      </div>
    </div>
  </section>

</main>

<div id="site-footer"></div>

<script src="assets/js/content.js?v=80efb247"></script>
<script src="assets/js/i18n.js?v=a9a08aae"></script>
<script src="assets/js/layout.js?v=4bafe8d7"></script>

</body>
</html>
