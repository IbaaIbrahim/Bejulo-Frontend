services:
  bejulo-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bejulo-frontend
    ports:
      - "${PORT:-4173}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
